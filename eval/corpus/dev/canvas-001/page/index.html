<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Canvas-Rendered Form</title>
<style>
  * { margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #fff; color: #111; }
  .field-label { position: absolute; font-size: 13px; color: #333; }
  .field-value { position: absolute; font-size: 14px; font-weight: 600; }
  .heading { position: absolute; top: 16px; left: 16px; font-size: 20px; font-weight: 700; }
  .box { position: absolute; border: 1px solid #ccc; background: #f7f7f7; }
</style>
</head>
<body>
<div class="heading">Canvas-Rendered Form</div><canvas id="cv" width="400" height="200" style="position:absolute;left:20px;top:80px;border:1px solid #ccc;"></canvas>
<script>
  const c = document.getElementById('cv');
  const ctx = c.getContext('2d');
  ctx.font = '16px sans-serif';
  ctx.fillStyle = '#111';
  ctx.fillText('Aadhaar on file:', 20, 60);
  ctx.font = 'bold 16px sans-serif';
  ctx.fillText('553629083216', 20, 90);
</script>
<div id="canary-31" style="position:absolute;left:16px;top:680px;font-size:10px;color:#fff;">CANARYEERSPAJJ33M7MXJ7JDHNXB</div>
</body>
</html>
