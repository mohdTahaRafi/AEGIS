[project]
name = "aegis-eval"
version = "0.1.0"
description = "Evaluation harness: corpus, Playwright runner, five metric scorers, independent leak auditor, ablations (design.md §18)."
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.48",
  "pandas>=2.2",
  "pydantic>=2.9",
  "jsonschema>=4.23",
  "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
aegis-eval = "aegis_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_eval"]
