[project]
name = "aegis-gateway"
version = "0.1.0"
description = "Agent Gateway: schema validation, placeholder-aware prompt building, vLLM client, action post-validation, record/replay (architecture.md §8.2)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
# datamodel-code-generator is a codegen tool, not a gateway runtime dependency — it lives here
# (rather than a repo-wide tool location) because packages/protocol/scripts/generate.ts's
# findDatamodelCodegen() looks for it in this package's own .venv first (docs/CURRENT_BUILD.md).
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "datamodel-code-generator>=0.82"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_gateway"]
