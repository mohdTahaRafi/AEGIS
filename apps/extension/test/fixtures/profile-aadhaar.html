<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Citizen Profile</title>
  </head>
  <body>
    <main>
      <section id="profile">
        <p id="aadhaar-line">Aadhaar on record: 2345 6789 0124</p>
        <p id="email-line">Signed in as ramesh.kumar@example.com</p>
        <p id="phone-line">Contact number: 9876543210</p>
      </section>
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" value="ramesh.kumar" />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" value="hunter2-correct-battery" />

        <button id="submit" type="submit">Sign in</button>
      </form>
      <label for="confirm-aadhaar">Aadhaar number</label>
      <input id="confirm-aadhaar" name="confirm_aadhaar" type="text" />
      <p id="hard-negative-tracking">Tracking number: 234567890128</p>
      <p id="hard-negative-order">Order #1234567890123456</p>
    </main>
  </body>
</html>
